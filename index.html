<script>
'use strict';
// Grade 2 Unit 3 Week 15: single-file, offline-capable student lesson.
const TITLE='Grade 2 ICT • Computational Thinking';
const goalItems=[
{icon:'🧩',title:'Follow instructions',detail:'I can put steps in the correct order.'},
{icon:'🔍',title:'Find mistakes',detail:'I can fix an instruction that is wrong.'},
{icon:'✂️',title:'Make code shorter',detail:'I can remove extra Scratch blocks.'},
{icon:'🚀',title:'Test my work',detail:'I can try my program and improve it.'}];
const shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wordOrder=shuffle(['Algorithm','Sequence','Debug','Concise']);
const meaningOrder=shuffle(['Short and clear','Find and fix a mistake','Steps in the correct order','A set of instructions']);
const scratchOld=[{id:'m1',type:'motion',text:'move 60 steps'},{id:'m2',type:'motion',text:'move 60 steps'},{id:'m3',type:'motion',text:'move 60 steps'},{id:'wait',type:'control',text:'wait 1 second',keep:true},{id:'z1',type:'looks',text:'change size by 10'},{id:'z2',type:'looks',text:'change size by 10'},{id:'z3',type:'looks',text:'change size by 10'}];
const choiceBlocks=[{id:'move180',type:'motion',text:'move 180 steps'},{id:'size30',type:'looks',text:'change size by 30'},{id:'move60',type:'motion',text:'move 60 steps'},{id:'size10',type:'looks',text:'change size by 10'}];
function sentenceFeedback(raw){const v=raw.trim();if(!v)return {ok:false,text:'Start with “I can help the Monkey by…” or “First, the Monkey…”'};
const words=v.match(/\p{L}+(?:['’-]\p{L}+)*/gu)||[];
if(words.length<6)return {ok:false,text:'Add a few more words. Try to write at least 6 words.'};
if(!/^\p{Lu}/u.test(v))return {ok:false,text:'Start your sentence with a CAPITAL letter.'};
if(!/[.!?]$/.test(v))return {ok:false,text:'Finish your sentence with a full stop (.), question mark (?) or exclamation mark (!).'};
return {ok:true,text:'✅ Great! This looks like a complete sentence. You can go to the next task.'};}
function conciseGood(){return scratchOld.filter(b=>!b.keep).every(b=>s.removedBlocks.includes(b.id))&&s.addedBlocks.length===2&&['move180','size30'].every(id=>s.addedBlocks.includes(id));}
const steps=[
{id:'register',name:'Student Registration',kind:'WELCOME',minutes:'1 min',required:true},
{id:'goals',name:'Learning Goals',kind:'START HERE',minutes:'3 min',required:true},
{id:'discussion',name:'Discussion Zone',kind:'DRIVING QUESTION',minutes:'4 min',required:true},
{id:'algorithm',name:'What Is an Algorithm?',kind:'LEARN · PART 1',minutes:'4 min',required:true},
{id:'vocabulary',name:'Six Important Keywords',kind:'LEARN · PART 2',minutes:'4 min',required:true},
{id:'sequence',name:'Follow the Correct Order',kind:'LEARN · PART 3',minutes:'4 min',required:true},
{id:'debug',name:'Debug the Rings',kind:'LEARN · PART 4',minutes:'4 min',required:true},
{id:'concise',name:'Make Scratch Code Shorter',kind:'LEARN · PART 5',minutes:'8 min',required:true},
{id:'practice',name:'Monkey & Bananas Lab',kind:'YOUR PRACTICE',minutes:'15 min',required:true},
{id:'quiz',name:'Algorithm Detective Quiz',kind:'REVIEW & QUIZ',minutes:'10 min',required:true},
{id:'reflection',name:'My Reflection',kind:'REFLECT',minutes:'4 min',required:true},
{id:'challenge',name:'Bonus Challenge',kind:'OPTIONAL · EXTRA',minutes:'5 min',required:false},
{id:'results',name:'Results & Excel Download',kind:'FINISH',minutes:'2 min',required:true}];
const originalSequence=['Start','Turn left','Move 2 steps forward','Turn right','Move 6 steps forward','Stop'];
const questions=[
{q:'What is an algorithm?',options:['A type of picture','A set of instructions','A computer mouse','A colour'],answer:1},
{q:'Why do we follow steps in the correct order?',options:['So the task works','To make the screen bigger','To change the weather','To open more games'],answer:0},
{q:'What is decomposition?',options:['Moving a sprite','Breaking a big task into small steps','Painting a picture','Typing more quickly'],answer:1},
{q:'What does debug mean?',options:['Add random blocks','Find and fix a mistake','Turn off the computer','Delete every file'],answer:1},
{q:'Which is more concise?',options:['Three move 60 blocks','Five move 20 blocks','One move 180 block','Nine move 10 blocks'],answer:2},
{q:'Three moves of 60 steps equal…',options:['60 steps','120 steps','180 steps','300 steps'],answer:2},
{q:'Three “change size by 10” blocks equal…',options:['Change size by 30','Change size by 5','Change size by 100','Move 30 steps'],answer:0},
{q:'Which block starts a Scratch program when you click the flag?',options:['Change size by 10','Wait 1 second','When green flag clicked','Move 60 steps'],answer:2},
{q:'What should you do after fixing your code?',options:['Test it again','Never open it','Hide the blocks','Change all the colours'],answer:0},
{q:'Why use “set size to 100%” at the start?',options:['Make the Monkey jump','Return to normal size each time','Make the Banana bigger','Stop the program'],answer:1}];
const vocab=[['Algorithm','A set of instructions'],['Sequence','Steps in the correct order'],['Decomposition','Break a big task into small parts'],['Debug','Find and fix a mistake'],['Repeat','Do an action again'],['Concise','Short and clear']];
const s={step:0,name:'',clazz:'',visited:{},goalDone:[],discussion:'',algorithmChoice:'',algorithmPassed:false,vocab:{},sequence:['Move 6 steps forward','Stop','Turn left','Start','Turn right','Move 2 steps forward'],seqAttempts:0,seqMessage:'',ringFirst:'',ringLast:'',removedBlocks:[],addedBlocks:[],conciseChecked:false,conciseMessage:'',labMove:'',labSize:'',labRuns:0,labResult:'',quiz:Array(questions.length).fill(-1),quizPage:0,reflection1:'',reflection2:'',confidence:'',challenge:'',downloaded:false};
const byId=id=>document.getElementById(id); const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const nl=t=>esc(t).replace(/\n/g,'<br>');
function isComplete(id){switch(id){case 'register':return !!(s.name.trim()&&s.clazz);case 'goals':return goalItems.every((_,i)=>s.goalDone.includes(i));case 'discussion':return sentenceFeedback(s.discussion).ok;case 'algorithm':return s.algorithmPassed;case 'vocabulary':return vocab.filter(([v])=>['Algorithm','Sequence','Debug','Concise'].includes(v)).every(([v])=>s.vocab[v]);case 'sequence':return s.seqAttempts>0;case 'debug':return !!(s.ringFirst&&s.ringLast);case 'concise':return s.conciseChecked;case 'practice':return s.labRuns>0;case 'quiz':return s.quiz.every(v=>v!==-1);case 'reflection':return !!(s.reflection1.trim()&&s.reflection2.trim());case 'challenge':return !!s.visited[id];case 'results':return s.downloaded;default:return false}}
function reqComplete(){return steps.filter(x=>x.required&&x.id!=='results').every(x=>isComplete(x.id))}
function currentAccessible(n){return n<=s.step||steps.slice(0,n).filter(x=>x.required&&x.id!=='results').every(x=>isComplete(x.id))}
function app(){const cur=steps[s.step];const done=steps.filter(x=>x.required&&x.id!=='results'&&isComplete(x.id)).length;const total=steps.filter(x=>x.required&&x.id!=='results').length;
byId('sidebar').innerHTML='<div class="sidetitle">Your learning journey</div>'+steps.map((it,i)=>'<button type="button" data-jump="'+i+'" class="navitem '+(i===s.step?'current ':'')+(isComplete(it.id)?'done ':'')+(!currentAccessible(i)?'locked':'')+'" '+(!currentAccessible(i)?'disabled':'')+' aria-label="'+esc(it.name)+'"><span class="navnum">'+(isComplete(it.id)?'✓':i+1)+'</span><span>'+esc(it.name)+'</span></button>').join('')+'<div class="sidebar-note">🌟 Learn a little, try a little, improve a little.</div>';
byId('progress').innerHTML='<div class="progress-box"><div class="progress-top"><strong>Task '+(s.step+1)+' of '+steps.length+' · '+esc(cur.name)+'</strong><span>'+done+'/'+total+' lesson tasks</span></div><div class="progress-track"><div class="progress-fill" style="width:'+Math.round(done/total*100)+'%"></div></div></div>';
byId('screen').innerHTML='<div class="kicker">'+esc(cur.kind)+' · '+cur.minutes+'</div>'+getScreen(cur.id);
const finish=s.step===steps.length-1;byId('footer').innerHTML='<button class="button ghost" id="prev" '+(s.step===0?'disabled':'')+'>← Previous</button><div class="footnote" id="navhint">'+(finish?'Download your Excel workbook before leaving.':(cur.id==='goals'?'Click each goal to unlock Next Task.':'One task at a time. You can go back to check your answers.'))+'</div>'+(!finish?'<button class="button" id="next" '+(cur.id==='goals'&&!isComplete('goals')?'disabled aria-disabled="true"':'')+'>'+(s.step===0?'Start Lesson →':'Next Task →')+'</button>':'<button class="button secondary" id="topBtn">↑ Back to start</button>');
attachEvents();}
function getScreen(id){switch(id){
case 'register':return `<h1 class="section-title">Welcome, young coder! 👋</h1><p class="lead">You will learn to follow, fix, and improve instructions. First, tell us who you are.</p><div class="grid2"><div class="card soft"><div class="illust">🐒 💻</div><p><strong>Your mission</strong><br>Help the Monkey find the Bananas using smart, short instructions!</p></div><div><div class="field"><label for="studentName">✍️ Student Name</label><input id="studentName" maxlength="80" value="${esc(s.name)}" placeholder="Type your first and last name" autocomplete="off"></div><div class="field"><label for="studentClass">🏫 Your Class</label><select id="studentClass"><option value="">Choose your class</option>${['2B1','2B2','2B3','2B4'].map(v=>'<option '+(s.clazz===v?'selected':'')+'>'+v+'</option>').join('')}</select></div><div id="registerMsg" class="hint">✅ Both fields are needed to start.</div></div></div><p class="callout"><strong>🔒 Privacy:</strong> Your name and answers stay in this browser until you download your Excel file.</p>`;
case 'goals':return `<h1 class="section-title">🎯 Learning Goals</h1><p class="lead">Read each goal. Click it when you understand it. Click all four to unlock <strong>Next Task</strong>.</p><div class="grid2">${goalItems.map((g,i)=>`<button type="button" class="goal-card ${s.goalDone.includes(i)?'checked':''}" data-goal="${i}" aria-pressed="${s.goalDone.includes(i)}"><span class="goal-icon">${g.icon}</span><span class="goal-copy"><strong>${g.title}</strong><span>${g.detail}</span></span><span class="goal-check">${s.goalDone.includes(i)?'✓':'○'}</span></button>`).join('')}</div><div class="feedback ${isComplete('goals')?'good':''}" id="goalStatus" role="status">${isComplete('goals')?'✅ All four goals clicked! Next Task is ready.':'Click each card. '+s.goalDone.length+' of 4 goals done.'}</div><p class="promptline">💡 An <strong>algorithm</strong> is a set of steps. We use steps to solve problems!</p>`;
case 'discussion':{const f=sentenceFeedback(s.discussion);return `<h1 class="section-title">💬 Discussion Zone</h1><p class="lead">Think about our driving question. Write <strong>one complete sentence</strong> in your own words.</p><div class="card soft"><p class="tiny" style="margin-top:0">🎯 DRIVING QUESTION</p><div class="question-label">How can we help the Monkey reach the Bananas using clear instructions?</div><div class="stage compact-stage" aria-hidden="true"><span class="animal">🐒</span><span class="banana">🍌</span></div></div><div class="field"><label for="discussionInput">✍️ My answer</label><textarea id="discussionInput" rows="3" maxlength="400" spellcheck="true" aria-describedby="sentenceCheck" placeholder="I can help the Monkey by...">${esc(s.discussion)}</textarea></div><div class="feedback ${f.ok?'good':'try'}" id="sentenceCheck" role="status" aria-live="polite">${esc(f.text)}</div><div class="card warm"><strong>💡 Need an idea?</strong><p class="hint" style="margin:8px 0">Think about <strong>steps</strong>, <strong>order</strong>, <strong>moving</strong>, or <strong>checking</strong>.</p><p style="margin:8px 0"><strong>Sentence starters:</strong></p><div class="choice-pair"><button type="button" class="button small secondary" data-starter="I can help the Monkey by ">I can help the Monkey by…</button><button type="button" class="button small secondary" data-starter="First, the Monkey should ">First, the Monkey should…</button></div><p class="tiny" style="margin:12px 0 0">✅ Complete sentence check: capital letter + at least 6 words + ending punctuation (. ! ?). This check helps with sentence form; your teacher will read your ideas.</p></div>`;}
case 'algorithm':return `<h1 class="section-title">🧠 What Is an Algorithm?</h1><p class="lead">An <strong>algorithm</strong> is a set of steps to complete a task.</p><div class="card soft"><div class="question-label">🎯 Task: Clean your room 🧸 📚 🛏️</div><p style="margin-bottom:0">Which set of instructions is a good algorithm for this task?</p></div><div class="algorithm-choices">${[{id:'wrong1',text:'1. Make a sandwich.  2. Eat it.  3. Wash a plate.'},{id:'correct',text:'1. Pick up toys.  2. Put away books.  3. Make your bed.'},{id:'wrong2',text:'1. Go outside.  2. Play football.  3. Go to sleep.'}].map(o=>`<button type="button" class="alg-choice ${s.algorithmChoice===o.id?'selected':''}" data-alg="${o.id}" aria-pressed="${s.algorithmChoice===o.id}">${esc(o.text)}</button>`).join('')}</div><button class="button" data-act="checkAlgorithm">🔍 Check My Algorithm</button><div id="algFeedback" class="feedback ${s.algorithmPassed?'good':'try'}" role="status" ${s.algorithmChoice?'':'style="display:none"'}>${s.algorithmPassed?'✅ Correct! These are clear steps to clean a room.':'Choose the instructions that really clean a room, then check.'}</div><p class="promptline">💡 A big job becomes easier when we break it into small steps. This is <strong>decomposition</strong>.</p>`;
case 'vocabulary':return `<h1 class="section-title">🔢 Six Important Keywords</h1><p class="lead">Read the words. Then match the four practice words with their meanings.</p><div class="card soft">${vocab.map(([w,m])=>'<p style="margin:7px 0"><strong>'+w+'</strong> — '+m+'</p>').join('')}</div><h2 class="smalltitle">🔀 Quick Word Match</h2><p class="hint">The words and answers are mixed into a new order.</p>${wordOrder.map((w,i)=>'<div class="word-row"><span class="word">'+(i+1)+'. '+w+'</span><select class="choice-select" aria-label="Meaning of '+w+'" data-vocab="'+w+'"><option value="">Choose a meaning</option>'+meaningOrder.map(a=>'<option value="'+a+'" '+(s.vocab[w]===a?'selected':'')+'>'+a+'</option>').join('')+'</select></div>').join('')}<button class="button secondary" data-act="checkVocab">✅ Check My Answers</button><div id="vocabFeedback" class="feedback" style="display:none" role="status"></div>`;
case 'sequence':return `<h1 class="section-title">🧩 Follow the Correct Order</h1><p class="lead">The Monkey needs clear steps. Put these instructions in order.</p><div class="callout"><strong>📝 Your Task:</strong> Drag a step, or use the ↑ and ↓ buttons, to move it.</div><div id="sortlist" style="margin-top:17px">${s.sequence.map((st,i)=>'<div class="reorder-item" draggable="true" data-drag-index="'+i+'"><span><strong>'+ (i+1)+'</strong>'+esc(st)+'</span><div class="reorder-controls"><button aria-label="Move '+esc(st)+' up" class="button small secondary" data-move="'+i+':-1" '+(i===0?'disabled':'')+'>↑</button><button aria-label="Move '+esc(st)+' down" class="button small secondary" data-move="'+i+':1" '+(i===s.sequence.length-1?'disabled':'')+'>↓</button></div></div>').join('')}</div><button class="button" data-act="checkSequence">🔍 Check My Order</button>${s.seqAttempts?'<div class="feedback '+(sequenceCorrect()?'good':'try')+'">'+esc(s.seqMessage)+'</div>':''}<p class="hint">💡 Tip: Every journey begins with <strong>Start</strong> and ends with <strong>Stop</strong>.</p>`;
case 'debug':return `<h1 class="section-title">🛠️ Debug the Rings</h1><p class="lead">Debug means <strong>find and fix a mistake</strong>.</p><div class="ring-wrap"><div class="ringstack" aria-label="Stacking rings from bottom: blue, green, yellow, orange, red"><div class="circle ring-top"></div><div class="circle ring-2"></div><div class="circle ring-3"></div><div class="circle ring-4"></div><div class="circle ring-5"></div><div class="ring-base"></div></div><div><p><strong>Oops!</strong> A robot says:</p><div class="card warm">1. Stack the red ring.<br>2. Stack the blue ring.<br>3. Stop.</div><p>These steps are wrong. Which ring should go on first?</p><div class="field"><label for="ringFirst">🔵 First ring (bottom)</label><select id="ringFirst"><option value="">Choose...</option>${['Red','Blue','Orange','Green'].map(v=>'<option '+(s.ringFirst===v?'selected':'')+'>'+v+'</option>').join('')}</select></div><div class="field"><label for="ringLast">🔴 Last ring (top)</label><select id="ringLast"><option value="">Choose...</option>${['Green','Yellow','Red','Blue'].map(v=>'<option '+(s.ringLast===v?'selected':'')+'>'+v+'</option>').join('')}</select></div></div></div><button class="button secondary" data-act="checkRings">✅ Check My Fix</button><div id="ringsFeedback" class="feedback" style="display:none"></div><div class="promptline"><strong>Debugging rule:</strong> Find → Fix → Test Again</div>`;
case 'concise':{const removed=s.removedBlocks.length;const good=conciseGood();const drawn=(id,type,label)=>`<span class="scratch ${type}">${esc(label)}</span>`;
return `<h1 class="section-title">🐒 Make Scratch Code Shorter</h1><p class="lead">The Monkey wants to reach the Bananas! Remove the old repeated blocks and add <strong>two better blocks</strong>.</p><div class="stage compact-stage" role="img" aria-label="Monkey on the left and Bananas on the right"><span class="animal">🐒</span><span class="banana">🍌</span></div><div class="callout"><strong>📝 Your mission:</strong> 1. Remove all <strong>3 move 60</strong> blocks and all <strong>3 change size by 10</strong> blocks. 2. Keep the Green Flag and Wait. 3. Add the best <strong>2 blocks</strong> from the 4 choices.</div><div class="code-edit-grid"><section class="card"><h2 class="smalltitle" style="margin-top:0">1. Remove the old blocks</h2><p class="hint">Tap <strong>Remove</strong> beside each old block.</p><div class="scratch-bundle"><span class="scratch event">⚑ when green flag clicked</span>${scratchOld.filter(b=>!s.removedBlocks.includes(b.id)).map(b=>`<div class="edit-code-row"><span class="scratch ${b.type}">${b.text}</span>${b.keep?'<span class="keep-tag">✓ Keep</span>':`<button type="button" class="button small ghost" data-remove="${b.id}" aria-label="Remove ${b.text}">✕ Remove</button>`}</div>`).join('')}</div><p class="hint" id="removedCount"><strong>${removed} of 6</strong> old blocks removed</p><button class="button small secondary" data-act="undoRemove" ${removed===0?'disabled':''}>↶ Undo last removal</button></section><section class="card mint"><h2 class="smalltitle" style="margin-top:0">2. Insert better blocks</h2><p class="hint">Select <strong>2</strong> useful code blocks.</p><div class="choice-grid">${choiceBlocks.map(b=>`<button type="button" class="block-option ${s.addedBlocks.includes(b.id)?'selected':''}" data-block="${b.id}" aria-pressed="${s.addedBlocks.includes(b.id)}"><span class="scratch ${b.type}">${b.text}</span><span class="add-label">${s.addedBlocks.includes(b.id)?'✓ Added':'+ Add'}</span></button>`).join('')}</div><h3 class="smalltitle" style="margin-bottom:6px">✅ Your new code</h3><div class="scratch-bundle"><span class="scratch event">⚑ when green flag clicked</span>${s.addedBlocks.filter(id=>id.startsWith('move')).map(id=>drawn(id,'motion',choiceBlocks.find(x=>x.id===id).text)).join('')}<span class="scratch control">wait 1 second</span>${s.addedBlocks.filter(id=>id.startsWith('size')).map(id=>drawn(id,'looks',choiceBlocks.find(x=>x.id===id).text)).join('')}</div><p class="tiny">${s.addedBlocks.length} of 2 suggested blocks selected</p></section></div><div class="action-row"><button class="button" data-act="checkConcise">🔍 Check My Shorter Code</button><button class="button secondary" data-act="resetConcise">↻ Start Over</button></div>${s.conciseMessage?`<div class="feedback ${good&&s.conciseChecked?'good':'try'}" role="status">${esc(s.conciseMessage)}</div>`:''}<p class="promptline">💡 Tip: 60 + 60 + 60 = 180. And 10 + 10 + 10 = 30. The finished code should use <strong>4 blocks</strong>, including the Green Flag and Wait.</p>`;}
case 'practice':{const both=s.labMove==='one180'&&s.labSize==='one30';const reached=['one180','three60'].includes(s.labMove);return `<h1 class="section-title">💻 Monkey & Bananas Lab</h1><p class="lead">Choose Scratch commands. Help the Monkey reach the Bananas and grow bigger!</p><div class="stage" aria-label="Monkey and Bananas coding simulation"><span class="animal ${s.labRuns?(reached?'at-goal':'short'):''}" id="monkey" style="${s.labRuns?(s.labSize==='one30'||s.labSize==='three10'?'':'transform:scale(1)'):''}">🐒</span><span class="banana">🍌</span></div><div class="grid2"><div class="field"><label for="labMove">1. Which moving code?</label><select id="labMove"><option value="">Choose a block...</option><option value="three60" ${s.labMove==='three60'?'selected':''}>move 60 steps × 3 blocks</option><option value="one180" ${s.labMove==='one180'?'selected':''}>move 180 steps × 1 block</option><option value="one60" ${s.labMove==='one60'?'selected':''}>move 60 steps × 1 block</option></select></div><div class="field"><label for="labSize">2. Which growing code?</label><select id="labSize"><option value="">Choose a block...</option><option value="three10" ${s.labSize==='three10'?'selected':''}>change size by 10 × 3 blocks</option><option value="one30" ${s.labSize==='one30'?'selected':''}>change size by 30 × 1 block</option><option value="one10" ${s.labSize==='one10'?'selected':''}>change size by 10 × 1 block</option></select></div></div><button class="button" data-act="runMonkey">▶ Run My Program</button>${s.labRuns?'<div class="feedback '+(both?'good':'try')+'">'+esc(s.labResult)+'</div>':''}<div class="promptline"><strong>💡 Tip:</strong> 60 + 60 + 60 = 180. And 10 + 10 + 10 = 30.</div><h2 class="smalltitle">🌟 Ready to try real Scratch?</h2><p class="hint">Open <a href="https://scratch.mit.edu/projects/editor/" target="_blank" rel="noopener noreferrer">Scratch Editor ↗</a>. Create a Monkey and Bananas project. Try <strong>when green flag clicked</strong> → <strong>go to x: -44 y: -46</strong> → <strong>set size to 100%</strong> → <strong>move 180 steps</strong> → <strong>wait 1 seconds</strong> → <strong>change size by 30</strong>. Save your Scratch project if your teacher asks.</p>`;}
case 'quiz':{const q=questions[s.quizPage],ans=s.quiz[s.quizPage];return `<h1 class="section-title">🎮 Algorithm Detective Quiz</h1><p class="lead">Answer 10 questions. Choose one answer for each question.</p><div class="tagline"><span class="tag">Question ${s.quizPage+1} of ${questions.length}</span><span class="tag">${s.quiz.filter(n=>n>=0).length} answered</span></div><div class="card soft"><div class="question-label">${esc(q.q)}</div></div><div style="margin:17px 0">${q.options.map((op,i)=>'<button type="button" class="quizoption '+(ans===i?'chosen':'')+'" data-answer="'+i+'" aria-pressed="'+(ans===i)+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(op)+'</button>').join('')}</div><div style="display:flex;justify-content:space-between;gap:10px"><button class="button secondary" data-act="quizPrev" ${s.quizPage===0?'disabled':''}>← Previous Question</button><button class="button" data-act="quizNext" ${s.quizPage===questions.length-1?'disabled':''}>Next Question →</button></div><p class="hint">When all 10 questions are answered, use <strong>Next Task</strong> below. You can go back to change an answer.</p>`;}
case 'reflection':return `<h1 class="section-title">💭 My Reflection</h1><p class="lead">Think about what you learned. Write a short answer in your own words.</p><div class="field"><label for="reflection1">1. One word I learned today is…</label><textarea id="reflection1" rows="2" placeholder="Example: Debug means fix a mistake.">${esc(s.reflection1)}</textarea></div><div class="field"><label for="reflection2">2. How did you make a Scratch program shorter?</label><textarea id="reflection2" rows="2" placeholder="Example: I used one move 180 block.">${esc(s.reflection2)}</textarea></div><div class="field"><label for="confidence">3. How do you feel about algorithms?</label><select id="confidence"><option value="">Choose how you feel...</option>${['😊 I understand','🙂 I need a little help','🆘 I need more practice'].map(v=>'<option '+(s.confidence===v?'selected':'')+'>'+v+'</option>').join('')}</select></div><p class="tiny">Your teacher will read your reflection. There is no wrong opinion.</p>`;
case 'challenge':return `<h1 class="section-title">🏆 Bonus Challenge</h1><p class="lead">The Monkey has reached the Bananas. How can it go home?</p><div class="stage" aria-hidden="true"><span class="animal at-goal">🐒</span><span class="banana">🍌</span></div><div class="question-label">Which Scratch instruction moves the Monkey back 180 steps?</div><div class="choice-pair" style="margin-top:15px">${['move 180 steps','move -180 steps','change size by 180'].map(v=>'<button type="button" class="choice-btn '+(s.challenge===v?'selected':'')+'" data-challenge="'+esc(v)+'">'+esc(v)+'</button>').join('')}</div>${s.challenge?'<div class="feedback '+(s.challenge==='move -180 steps'?'good':'try')+'">'+(s.challenge==='move -180 steps'?'✅ Correct! A negative movement goes backwards.':'Try again. Which number means backwards?')+'</div>':''}<p class="promptline">⭐ Bonus idea: Add <strong>set size to 100%</strong> and <strong>go to x: -44 y: -46</strong> at the start so the Monkey resets when you click the Green Flag.</p>`;
case 'results':{const sc=score(),complete=reqComplete();return `<h1 class="section-title">🎉 Your Learning Results</h1><p class="lead">Great work, ${esc(s.name||'young coder')}! You have learned how to follow, debug and improve instructions.</p><div class="grid2"><div class="scorecard"><div class="tiny">Quiz score</div><div class="success-score">${sc.quiz}/10</div><div class="hint">${Math.round(sc.quiz/10*100)}% · 10 review questions</div></div><div class="scorecard"><div class="tiny">Activity score</div><div class="success-score">${sc.activity}/${sc.maxActivity}</div><div class="hint">Automatically checked activities</div></div></div><div style="margin-top:15px" class="card"><div class="result-row"><strong>Student name</strong><span>${esc(s.name)}</span></div><div class="result-row"><strong>Class</strong><span>${esc(s.clazz)}</span></div><div class="result-row"><strong>Required tasks</strong><span>${complete?'Completed':'Incomplete'}</span></div><div class="result-row"><strong>Teacher review</strong><span>Discussion + Reflection</span></div></div><h2 class="smalltitle">📥 Download Your Excel Results</h2><p>Your Excel file includes five worksheets: Student Information, Activity Results, Quiz Results, Reflection, and Summary.</p><button class="button" data-act="download" ${complete?'':'disabled'}>⬇ Download My Excel Results (.xlsx)</button>${s.downloaded?'<div class="feedback good">✅ Excel file prepared for download. Please check your Downloads folder and submit it through VinSchool LMS.</div>':''}${!complete?'<div class="feedback try">Finish the required lesson tasks before downloading your results.</div>':''}<h2 class="smalltitle">📤 Submit Your Work to VinSchool LMS</h2><ol class="step-list"><li>Click <strong>Download My Excel Results</strong>.</li><li>Find the downloaded Excel file on your computer.</li><li>Open <strong>VinSchool LMS</strong>.</li><li>Go to your <strong>Week 15 ICT Interactive Lesson</strong> assignment.</li><li>Upload your Excel file.</li><li>Click <strong>Submit Assignment</strong>.</li><li>Check that your submission was successful.</li></ol><div class="callout"><strong>Important:</strong> Downloading does not submit your work. Your task is finished only after you submit your Excel file in VinSchool LMS.</div>`;}
}}
function collect(){const value=(id,prop)=>{const el=byId(id);if(el)s[prop]=el.value};value('studentName','name');value('studentClass','clazz');value('discussionInput','discussion');value('ringFirst','ringFirst');value('ringLast','ringLast');value('labMove','labMove');value('labSize','labSize');value('reflection1','reflection1');value('reflection2','reflection2');value('confidence','confidence')}
function showInline(id,message,good){const el=byId(id);if(el){el.style.display='block';el.className='feedback '+(good?'good':'try');el.textContent=message}}
function sequenceCorrect(){return s.sequence.every((v,i)=>v===originalSequence[i])}
function quizScore(){return s.quiz.reduce((a,ans,i)=>a+(ans===questions[i].answer?1:0),0)}
function score(){let activity=s.algorithmPassed?1:0;for(const [w,meaning] of vocab)if(['Algorithm','Sequence','Debug','Concise'].includes(w)&&s.vocab[w]===meaning)activity++;if(sequenceCorrect()&&s.seqAttempts)activity++;if(s.ringFirst==='Blue')activity++;if(s.ringLast==='Red')activity++;if(s.removedBlocks.length===6)activity++;if(s.addedBlocks.includes('move180')&&!s.addedBlocks.includes('move60'))activity++;if(s.addedBlocks.includes('size30')&&!s.addedBlocks.includes('size10'))activity++;if(s.labRuns&&s.labMove==='one180')activity++;if(s.labRuns&&s.labSize==='one30')activity++;return {activity,maxActivity:13,quiz:quizScore()}}
function attachEvents(){document.querySelectorAll('[data-jump]').forEach(el=>el.addEventListener('click',()=>{collect();const n=Number(el.dataset.jump);if(currentAccessible(n)){s.step=n;app();scrollTop()}}));
const prev=byId('prev');if(prev)prev.addEventListener('click',()=>{collect();if(s.step>0){s.step--;app();scrollTop()}});
const next=byId('next');if(next)next.addEventListener('click',()=>{collect();const id=steps[s.step].id;
if(id==='register'&&!isComplete(id)){const el=byId('registerMsg');if(el){el.className='feedback try';el.textContent='Please enter your name and choose a class first.'}return}
if(id==='challenge')s.visited[id]=true;
if(!isComplete(id)){const hints={goals:'Click all four learning goals first.',discussion:sentenceFeedback(s.discussion).text,algorithm:'Choose the correct algorithm and check your answer.',vocabulary:'Match all four practice words before continuing.',sequence:'Click “Check My Order” at least once.',debug:'Answer both ring questions before continuing.',concise:'Remove the six repeated blocks, add the two best blocks, and check your code.',practice:'Choose two blocks and click “Run My Program”.',quiz:'Answer all 10 quiz questions before continuing.',reflection:'Write a short answer to questions 1 and 2.'};const e=byId('navhint');if(e){e.textContent=hints[id]||'Please finish the task first.';e.style.color='#b15333'}return}
if(s.step<steps.length-1){s.step++;app();scrollTop()}});
const top=byId('topBtn');if(top)top.addEventListener('click',()=>{s.step=0;app();scrollTop()});
document.querySelectorAll('[data-goal]').forEach(el=>el.addEventListener('click',()=>{const n=Number(el.dataset.goal);s.goalDone=s.goalDone.includes(n)?s.goalDone.filter(x=>x!==n):[...s.goalDone,n];app()}));
const discussion=byId('discussionInput');if(discussion)discussion.addEventListener('input',()=>{s.discussion=discussion.value;const f=sentenceFeedback(s.discussion);const status=byId('sentenceCheck');status.textContent=f.text;status.className='feedback '+(f.ok?'good':'try')});
document.querySelectorAll('[data-starter]').forEach(el=>el.addEventListener('click',()=>{const ta=byId('discussionInput');if(!ta)return;ta.value=el.dataset.starter;ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}))}));
document.querySelectorAll('[data-alg]').forEach(el=>el.addEventListener('click',()=>{s.algorithmChoice=el.dataset.alg;s.algorithmPassed=false;app()}));
document.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{s.removedBlocks.push(el.dataset.remove);s.conciseChecked=false;s.conciseMessage='';app()}));
document.querySelectorAll('[data-block]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.block;if(s.addedBlocks.includes(id))s.addedBlocks=s.addedBlocks.filter(x=>x!==id);else if(s.addedBlocks.length<2)s.addedBlocks.push(id);else{s.conciseMessage='Choose only 2 new blocks. Tap an added block to remove it first.';app();return}s.conciseChecked=false;s.conciseMessage='';app()}));
document.querySelectorAll('[data-vocab]').forEach(el=>el.addEventListener('change',()=>{s.vocab[el.dataset.vocab]=el.value}));
['labMove','labSize'].forEach(id=>{const el=byId(id);if(el)el.addEventListener('change',()=>{collect();s.labRuns=0;s.labResult='';app()})});
document.querySelectorAll('[data-move]').forEach(el=>el.addEventListener('click',()=>{const [i,delta]=el.dataset.move.split(':').map(Number);const j=i+delta;if(j<0||j>=s.sequence.length)return;[s.sequence[i],s.sequence[j]]=[s.sequence[j],s.sequence[i]];app()}));

function action(act){collect();if(act==='checkVocab'){const results=vocab.filter(([w])=>['Algorithm','Sequence','Debug','Concise'].includes(w));const n=results.filter(([w,a])=>s.vocab[w]===a).length;showInline('vocabFeedback',n+' of 4 correct. '+(n===4?'Great matching!':'Look at the keyword list and try again.'),n===4)}
else if(act==='checkSequence'){s.seqAttempts++;s.seqMessage=sequenceCorrect()?'✅ Excellent! Your instructions are in the correct order.':'🔎 Some instructions are out of order. Check the start, turns, movements and stop.';app()}
else if(act==='checkRings')showInline('ringsFeedback',(s.ringFirst==='Blue'&&s.ringLast==='Red')?'✅ Correct! Blue at the bottom and red at the top.':'Try again. Look at the picture: which colour is at the bottom and which at the top?',s.ringFirst==='Blue'&&s.ringLast==='Red');
else if(act==='checkAlgorithm'){s.algorithmPassed=s.algorithmChoice==='correct';showInline('algFeedback',s.algorithmPassed?'✅ Correct! These instructions help clean the room.':'Look again. Which steps are about cleaning your room?',s.algorithmPassed)}
else if(act==='checkConcise'){const removed=s.removedBlocks.length;if(removed<6)s.conciseMessage='Remove all six old move and size blocks first ('+removed+' of 6 removed).';else if(s.addedBlocks.length!==2)s.conciseMessage='Choose exactly two better code blocks.';else if(!conciseGood())s.conciseMessage='Try again! Use move 180 steps and change size by 30.';else s.conciseMessage='🎉 Great work! You made the 8-block program shorter with only 4 blocks.';s.conciseChecked=conciseGood();app()}
else if(act==='undoRemove'){s.removedBlocks.pop();s.conciseChecked=false;s.conciseMessage='';app()}
else if(act==='resetConcise'){s.removedBlocks=[];s.addedBlocks=[];s.conciseChecked=false;s.conciseMessage='';app()}
else if(act==='runMonkey'){if(!s.labMove||!s.labSize){const el=byId('navhint');el.textContent='Choose a movement and a size block first.';return}s.labRuns++;const reached=['one180','three60'].includes(s.labMove),grown=['one30','three10'].includes(s.labSize),concise=s.labMove==='one180'&&s.labSize==='one30';s.labResult=!reached?'The Monkey did not reach the Bananas. Try moving 180 steps.':!grown?'The Monkey moved, but did not grow enough. Try growing by 30.':!concise?'✅ The program works! Can you use just ONE block for movement and ONE for growing?':'🎉 Brilliant! The Monkey reaches the Bananas, grows, and uses fewer blocks.';app()}
else if(act==='quizPrev'){s.quizPage=Math.max(0,s.quizPage-1);app()}
else if(act==='quizNext'){s.quizPage=Math.min(questions.length-1,s.quizPage+1);app()}
else if(act==='download'){if(!reqComplete())return;downloadXLSX();s.downloaded=true;app()}}

function workbookSheets(){const sc=score();const date=new Date().toLocaleDateString('en-CA');const completed=reqComplete()?'Completed':'Incomplete';const student=[['STUDENT INFORMATION'],['Field','Value'],['Student Name',s.name],['Class',s.clazz],['Grade','2'],['Subject','ICT'],['Unit','3'],['Week','15'],['Lesson Topic','Computational Thinking'],['Completion Date',date],['Completion Status',completed]];
const activity=[['ACTIVITY RESULTS'],['Task','Question / Activity','Student Answer','Correct Answer','Result','Score']];const add=(t,q,a,k,correct,points=1)=>activity.push([t,q,String(a??''),String(k??''),correct===null?'For Teacher Review':correct?'Correct':'Incorrect',correct===null?'For Teacher Review':(correct?points:0)+' / '+points]);
add('Discussion','Answer to driving question',s.discussion,'Complete sentence — teacher reviews the idea',null);
for(const g of goalItems)add('Learning Goals',g.title,s.goalDone.includes(goalItems.indexOf(g))?'Clicked':'Not clicked','Clicked',null);
add('Algorithm','Algorithm to clean a room',s.algorithmChoice||'Not answered','Pick up toys → Put away books → Make your bed',s.algorithmPassed);
for(const [w,m] of vocab.filter(([w])=>['Algorithm','Sequence','Debug','Concise'].includes(w)))add('Word Match','Meaning of '+w,s.vocab[w]||'Not answered',m,s.vocab[w]===m);
add('Sequence','Put the path steps in order',s.sequence.join(' → '),originalSequence.join(' → '),sequenceCorrect()&&s.seqAttempts>0);
add('Debug','First ring to stack',s.ringFirst,'Blue',s.ringFirst==='Blue');add('Debug','Last ring to stack',s.ringLast,'Red',s.ringLast==='Red');
add('Concise Code','Remove the six old repeated blocks',s.removedBlocks.join(', ')||'None','m1, m2, m3, z1, z2, z3',s.removedBlocks.length===6);
add('Concise Code','Insert a shorter movement block',s.addedBlocks.filter(x=>x.startsWith('move')).join(', ')||'None','move180',s.addedBlocks.includes('move180')&&!s.addedBlocks.includes('move60'));
add('Concise Code','Insert a shorter growing block',s.addedBlocks.filter(x=>x.startsWith('size')).join(', ')||'None','size30',s.addedBlocks.includes('size30')&&!s.addedBlocks.includes('size10'));
add('Monkey Lab','Movement blocks',s.labMove,'one180',s.labRuns>0&&s.labMove==='one180');add('Monkey Lab','Growing blocks',s.labSize,'one30',s.labRuns>0&&s.labSize==='one30');
add('Bonus Challenge','Move Monkey home',s.challenge||'Not attempted (optional)','move -180 steps',s.challenge? s.challenge==='move -180 steps':null);
const quiz=[['QUIZ RESULTS'],['Question #','Question','Student Answer','Correct Answer','Result','Points']];questions.forEach((q,i)=>{const a=s.quiz[i];quiz.push([String(i+1),q.q,a>=0?q.options[a]:'Not answered',q.options[q.answer],a===q.answer?'Correct':'Incorrect',a===q.answer?'1 / 1':'0 / 1'])});quiz.push(['','TOTAL','','','',sc.quiz+' / '+questions.length]);
const reflection=[['STUDENT REFLECTION'],['Prompt','Student Response'],['Driving question: Help the Monkey',s.discussion],['Sentence form check',sentenceFeedback(s.discussion).ok?'Passed':'Needs editing'],['One word I learned',s.reflection1],['How I made a program shorter',s.reflection2],['How I feel',s.confidence||'Not provided'],['Extra Challenge (optional)',s.challenge||'Not attempted']];
const summary=[['LESSON SUMMARY'],['Item','Value'],['Learning Goals Clicked',s.goalDone.length+' / 4'],['Discussion Sentence Check',sentenceFeedback(s.discussion).ok?'Passed':'Needs editing'],['Completed Required Tasks',String(steps.filter(x=>x.required&&x.id!=='results'&&isComplete(x.id)).length)],['Total Required Tasks',String(steps.filter(x=>x.required&&x.id!=='results').length)],['Quiz Score',sc.quiz+' / '+questions.length],['Quiz Percentage',Math.round(sc.quiz/questions.length*100)+'%'],['Objective Activity Score',sc.activity+' / '+sc.maxActivity],['Combined Objective Score',(sc.activity+sc.quiz)+' / '+(sc.maxActivity+questions.length)],['Teacher Review','Discussion and reflection'],['Completion Status',completed],['Completion Date',date],['Note','Objective scores do not include teacher-reviewed responses or practical Scratch file assessment.']];
return [{name:'Student Information',rows:student,widths:[30,54]},{name:'Activity Results',rows:activity,widths:[22,49,62,58,23,23]},{name:'Quiz Results',rows:quiz,widths:[15,60,55,53,23,20]},{name:'Reflection',rows:reflection,widths:[48,96]},{name:'Summary',rows:summary,widths:[37,100]}]}

const encoder=new TextEncoder();function le16(a,p,v){a[p]=v&255;a[p+1]=(v>>>8)&255}function le32(a,p,v){le16(a,p,v);le16(a,p+2,v>>>16)}
const crcTable=(()=>{const a=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);a[n]=c>>>0}return a})();function crc32(b){let c=0xffffffff;for(const val of b)c=crcTable[(c^val)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function zipFiles(files){const out=[],central=[];let offset=0;for(const [filename,contents] of Object.entries(files)){const name=encoder.encode(filename),data=encoder.encode(contents),crc=crc32(data);const head=new Uint8Array(30+name.length);le32(head,0,0x04034b50);le16(head,4,20);le16(head,6,0x0800);le16(head,8,0);le16(head,10,0);le16(head,12,0);le32(head,14,crc);le32(head,18,data.length);le32(head,22,data.length);le16(head,26,name.length);le16(head,28,0);head.set(name,30);out.push(head,data);
const dir=new Uint8Array(46+name.length);le32(dir,0,0x02014b50);le16(dir,4,20);le16(dir,6,20);le16(dir,8,0x0800);le16(dir,10,0);le16(dir,12,0);le16(dir,14,0);le32(dir,16,crc);le32(dir,20,data.length);le32(dir,24,data.length);le16(dir,28,name.length);le16(dir,30,0);le16(dir,32,0);le16(dir,34,0);le16(dir,36,0);le32(dir,38,0);le32(dir,42,offset);dir.set(name,46);central.push(dir);offset+=head.length+data.length;}
const cdSize=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22);le32(end,0,0x06054b50);le16(end,8,central.length);le16(end,10,central.length);le32(end,12,cdSize);le32(end,16,offset);return new Blob([...out,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
